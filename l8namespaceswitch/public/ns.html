<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namespace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container border p-0">
        <h3 class="bg-primary text-white p-3">Socket.IO Namespaces "/namespace " </h3>
        <div class="p-3">
            <p>
                <a href="/" class="btn border-bottom">Home Page</a>
                <a href="/admin" class="btn border-bottom">Admin Page</a>
                <a href="/ns" class="btn border-bottom active">Namespaces</a>
            </p>

            <div class="namespace-wrapper">
                <h3 id="current-ns">Current Namespace : (none)</h3>
                <div id="btn-container" class="mt-3">

                </div>
            </div>

            <hr />

            <form action="" id="messageform" class="mt-3">
                <div class="row">
                    <div class="col-sm-6 mt-3">
                        <input type="text" name="usermessage" id="usermessage" class="form-control"
                            placeholder="Enter your message">
                    </div>
                    <div class="col-sm-2 mt-3">
                        <input type="submit" class="w-100 btn btn-success" value="Send">
                    </div>
                </div>
            </form>

            <ul id="messages" class="mt-3"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const rootSocket = io();
        let currentSocket = null;
        let currentNamespace = null;

        // ui
        const newli = (message) => {
            const li = document.createElement("li");
            li.textContent = message;
            document.getElementById("messages").appendChild(li);
        }

        // events
        rootSocket.on("connect", () => {
            console.log(`Connect to server, My ID is : ${rootSocket.id}`);
        });

        rootSocket.on("welcome", (payload) => {
            newli(`Welcome event from ${payload.ns} : ${payload.message}`);
        });

        rootSocket.on("nsList", (nsData) => {
            const btncontainerEl = document.querySelector("#btn-container");
            nsData.forEach(data => {
                const btnEl = document.createElement("button");
                btnEl.textContent = data.name ?? "button";
                btnEl.type = "button";
                btnEl.className = "me-2";
                btnEl.dataset.endpoint = data.endpoint ?? "/";

                btnEl.onclick = () => switchNamespace(data.endpoint);

                btncontainerEl.appendChild(btnEl);
            });
        });

        rootSocket.on("broadcast", payload => {
            newli(`${payload.ns} = ${payload.text}`);
        });

        // handle submit
        document.querySelector("#messageform")?.addEventListener("submit", (e) => {

            e.preventDefault(); // don't reload page, don't send data to server

            const inputEl = document.querySelector("#usermessage");
            const messageVal = inputEl.value.trim();

            console.log(typeof messageVal);

            if (!messageVal) return;

            console.log(messageVal);

            socket.emit("defautns", {
                ns: "/",
                text: messageVal
            });
        });


        // default event
        rootSocket.on("reconnect", (attemptNumber) => {
            console.log("Reconnected : ", attemptNumber);
        });

        // helpers
        function switchNamespace(endpoint) {
            document.querySelector("#current-ns").textContent = `Current Namespace:  ${endpoint}`;

            // create socket for namespace
            currentNamespace = endpoint;
            currentSocket = io(endpoint);

            currentSocket.on("connect", () => {
                console.log(`Connect to ${endpoint}, My ID is : ${currentSocket.id}`);
            });

            // listen from server
            currentSocket.on("welcome", (payload) => {
                newli(payload.msg);
            });

        }


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
