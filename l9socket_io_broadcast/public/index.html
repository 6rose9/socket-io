<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket vs io vs broadcast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container border p-0">
        <h3 class="bg-primary text-white p-3">Socket vs IO vs Broadcast</h3>
        <div class="p-3">
            <form action="" id="messageform" class="mt-3">
                <div class="row g-2">
                    <div class="col-sm-6 mt-3">
                        <input type="text" name="usermessage" id="usermessage" class="form-control"
                            placeholder="Enter your message">
                    </div>
                    <div class="col-sm-2 mt-3">
                        <input type="submit" class="w-100 btn btn-success" value="Send">
                    </div>
                </div>
            </form>

            <ul id="messages" class="list-group mt-3"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const socket = io();

        const newli = (message) => {
            const li = document.createElement("li");
            li.textContent = message;
            document.getElementById("messages").appendChild(li);
        }

        socket.on("connect", () => {
            console.log(`Connect to server, My ID is : ${socket.id}`);
        });

        // handle submit
        document.querySelector("#messageform")?.addEventListener("submit", (e) => {

            e.preventDefault(); // don't reload page, don't send data to server

            const inputEl = document.querySelector("#usermessage");
            const messageVal = inputEl.value.trim();

            if (!messageVal) return;

            socket.emit("sendtoserver", messageVal);

            inputEl.value = null;
            inputEl.focus();
        });

        socket.on("sendbyinstance", payload => {
            newli(`${payload.method}: ${payload.message}`);
        });

        socket.on("sendbyparameter", payload => {
            newli(`${payload.method}: ${payload.message}`);
        });

        socket.on("sendbybroadcast", payload => {
            newli(`${payload.method}: ${payload.message}`);
        });

    </script>
</body>

</html>
