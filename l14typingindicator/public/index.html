<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Sockets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container border p-0">
        <h3 class="bg-primary text-white p-3">Socket IO Room Basic</h3>

        <div class="d-flex align-items-between gap-2 p-2">
            <select id="selectroom" class="form-select w-50">
                <option value="room-a">Room A</option>
                <option value="room-b">Room B</option>
            </select>

            <button id="selectroom-btn" class="btn btn-warning">Join Room</button>
        </div>

        <p id="selected-room" class="m-2">Selected Room: (none)</p>
        <p id="member-count" class="m-2">Number of member: 0</p>

        <hr />

        <div class="p-2 pt-0">
            <form action="" id="messageform" class="">
                <div class="row g-2">
                    <div class="col-sm-6 mt-3">
                        <input type="text" name="usermessage" id="usermessage" class="form-control"
                            placeholder="Enter your message">
                    </div>
                    <div class="col-sm-2 mt-3">
                        <input type="submit" class="w-100 btn btn-success" value="Send Message">
                    </div>
                </div>
            </form>

            <p id="typingstatus" class="text-muted"></p>

            <ul id="messages" class="list-group mt-3"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        const socket = io();

        const newli = (message) => {
            const li = document.createElement("li");
            li.textContent = message;
            document.getElementById("messages").appendChild(li);
        }

        const callback = (roomname, count) => {
            document.querySelector('#member-count').textContent = `Number of member: ${count}`;
        }

        socket.on("connect", () => {
            console.log(`Connect to server, My ID is : ${socket.id}`);
        });

        // handle submit
        document.querySelector("#selectroom-btn")?.addEventListener("click", (e) => {

            e.preventDefault(); // don't reload page, don't send data to server

            const selectRoomEl = document.querySelector("#selectroom");
            const selectRoomVal = selectRoomEl.value.trim();

            if (!selectRoomVal) return;

            socket.emit("joinroom", selectRoomVal, callback);
        });

        document.getElementById("messageform")?.addEventListener("submit", event => {
            event.preventDefault();

            const usermessageEl = document.querySelector("#usermessage");
            let message = usermessageEl.value.trim();

            if (!message) return;

            // send to server
            socket.emit("usermessage", message);

            usermessageEl.value = "";
            usermessageEl.focus();
        });

        // listen to server
        socket.on("joined", msg => {
            const selectedRoomEl = document.getElementById("selected-room");
            if (selectedRoomEl) {
                selectedRoomEl.textContent = msg;
                console.log("Joined room:", msg);
            }
        });

        socket.on("roommessage", (payload) => {
            newli(`${payload.sender} send "${payload.message}" to ${payload.room} at ${new Date(payload.date)}`);
        });

        socket.on("livecount", (payload) => {
            console.log("livecount", payload);
            callback(payload.room, payload.count);
        });

    </script>
</body>

</html>
