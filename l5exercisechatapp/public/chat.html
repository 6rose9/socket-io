<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container border p-0">

        <h3 class="bg-primary text-white p-3">Chat App</h3>

        <div class="p-3">
            <a href="/">Go To Home</a>

            <form action="" id="messageform" class="mt-3">
                <div class="row">
                    <div class="col-sm-6 mt-3">
                        <input type="text" name="usermessage" id="usermessage" class="form-control"
                            placeholder="Enter your message">
                    </div>
                    <div class="col-sm-2 mt-3">
                        <input type="submit" class="w-100 btn btn-success" value="Send">
                    </div>
                </div>
            </form>

            <ul id="displayMessages" class="list-group mt-3"></ul>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // connect to same origin (http://localhost:3000)
        const socket = io(); // io(http://localhost:3000)

        console.log(socket);

        socket.on("connect", () => {
            console.log(`Connect to server, My ID is : ${socket.id}`);
            socket.emit("msgfromClient", { msg: "Hello Server!" });
        });

        socket.on("msgfromserver", (payload) => {
            console.log(`Server Data:`, payload);
        });

        socket.on("reconnect", (attemptNumber) => {
            console.log("Reconnected : ", attemptNumber);
        });

        // listen messages
        socket.on("notifyAllUsers", data => {
            const newli = document.createElement("li");
            newli.className = "list-group-item d-flex justify-content-between";
            newli.textContent = data.message;

            const newspan = document.createElement("span");
            newspan.textContent = data.time;
            newli.appendChild(newspan);

            document.querySelector("#displayMessages").appendChild(newli);
        });

        // handle form submit
        document.querySelector("#messageform").addEventListener("submit", (e) => {
            e.preventDefault();

            const inputEl = document.querySelector("#usermessage");
            // console.log("message element",inputEl);

            const usermessage = inputEl.value.trim();
            if (!usermessage) return;

            console.log("user message:", usermessage);

            // send message to server
            socket.emit("usermessage", { data: usermessage });

            inputEl.value = "";
            inputEl.focus();
        });

    </script>
</body>

</html>
